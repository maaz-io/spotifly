name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships with an Android SDK + accepted licenses preinstalled
      # (ANDROID_HOME already set); AGP will auto-download any missing platform
      # or build-tools components during the Gradle build itself.

      # The project's custom debug signing config expects a debug.keystore at
      # the repo root (gitignored locally); generate a matching one in CI.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # No gradlew wrapper script/jar is committed to this repo, so install
      # Gradle standalone at the exact version pinned in gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
